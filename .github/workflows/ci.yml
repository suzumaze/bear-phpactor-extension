name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # phpactor requires ^8.2; 8.5 is what this package is developed on.
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: PHPStan
        # phpstan's default 128M memory limit is exhausted by this package's
        # analysis (our code raised the analysis cost); 192M passes but barely,
        # so 256M leaves margin. `parameters.memoryLimit` is not a valid phpstan
        # config key, so the limit must be passed on the command line.
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=256M

  latest-dependencies:
    name: Latest dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Resolve latest compatible dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Check latest dependency set
        run: composer check

  semantic-regression:
    name: BEAR.Kata semantic regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install extension dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check out fixed BEAR.Kata corpus
        uses: actions/checkout@v4
        with:
          repository: bearsunday/BEAR.Kata
          ref: 6bb0139a22c6e4fb2b6d4cdd5e6002817e00217d
          path: bear-kata

      - name: Verify semantic definition coverage
        run: php tools/coverage.php bear-kata --assert-clean --expect-sites=474

      - name: Verify semantic non-interference
        run: php tools/misfire.php bear-kata --assert-clean --expect-sites=474 --expect-probes=948
